name: Adviser CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Verify container build
        run: docker build -t adviser:ci .
      - name: Verify container health
        run: |
          docker run -d --name adviser-ci -p 3000:3000 adviser:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs adviser-ci
          exit 1
